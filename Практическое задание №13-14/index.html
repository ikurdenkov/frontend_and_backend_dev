<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мои заметки (PWA)</title>
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Мета-теги для Android и iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4285f4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/favicon-152x152.png">
    
    <!-- Иконка вкладки браузера -->
    <link rel="icon" href="/icons/favicon.ico" sizes="16x16" type="image/ico">
    
    <!-- Подключаем шрифты и базовый стиль -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6fa;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: all 0.2s ease;
        }
        .header {
            background: linear-gradient(135deg, #4285f4, #34a0f5);
            padding: 2rem 1.5rem;
            color: white;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header p {
            opacity: 0.9;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }
        .network-status {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            width: fit-content;
        }
        .network-status.offline {
            background: rgba(0,0,0,0.3);
            color: #ffd6d6;
        }
        .form-section {
            padding: 1.5rem;
            background: white;
            border-bottom: 1px solid #eef2f6;
        }
        .note-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .note-form input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            font-size: 1rem;
            font-family: inherit;
            transition: 0.2s;
            outline: none;
        }
        .note-form input:focus {
            border-color: #4285f4;
            box-shadow: 0 0 0 3px rgba(66,133,244,0.2);
        }
        .note-form button {
            background: #4285f4;
            border: none;
            padding: 0 28px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .note-form button:hover {
            background: #2a6cd6;
        }
        .notes-list {
            padding: 0 1.5rem 1.5rem 1.5rem;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .note-item {
            background: #ffffff;
            border-radius: 20px;
            padding: 1rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            transition: all 0.2s;
        }
        .note-item:hover {
            border-color: #d0e0ff;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.1);
        }
        .note-text {
            font-size: 1rem;
            line-height: 1.4;
            word-break: break-word;
            flex: 1;
            padding-right: 1rem;
        }
        .delete-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.2s;
            padding: 6px 12px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-btn:hover {
            color: #ef4444;
            background: #fef2f2;
        }
        .empty-message {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        @media (max-width: 500px) {
            .note-form input {
                width: 100%;
            }
            .note-form button {
                width: 100%;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 Заметки</h1>
        <p>Офлайн-приложение с установкой на рабочий стол</p>
    </div>
    <div class="form-section">
        <form id="note-form" class="note-form">
            <input type="text" id="note-input" placeholder="Введите заметку..." autocomplete="off" required>
            <button type="submit">Добавить</button>
        </form>
    </div>
    <ul id="notes-list" class="notes-list">
        <!-- Заметки будут добавляться сюда динамически -->
    </ul>
</div>

<script src="app.js"></script>
</body>
</html>
